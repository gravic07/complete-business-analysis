project_name: cba
app_name: config
app_user: django
app_group: django
app_user_home: /home/{{ app_user }}
app_home: /home/{{ app_user }}/{{ project_name }}
app_repo: git@github.com:gravic07/complete-business-analysis.git
app_branch: master
dotfiles_repo: git@github.com:gravic07/dotfiles.git
dotfiles_branch: master
app_src: "{{ app_home }}"
app_venv: "{{ app_home }}/.venv"
app_env_file: "{{ app_home }}/.env"

ssh_port: 2207
admin_user: gravic
admin_ssh_pubkey: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIM+SfBlEIR/WyF8J64LmnZIpup0zcLhpf6w+oKebkIyZ"
# Adding a developer later is purely a manual server operation: create user,
# add to sshusers, drop their public key, NOPASSWD in sudoers.

python_version: "3.14"
node_major_version: 22

domain_name: cba.3-peak.com
admin_email: grant@3-peak.com

postgres_version: 17
postgres_db: cba
postgres_user: cba
postgres_host: localhost
postgres_port: 5432

redis_bind: 127.0.0.1
redis_port: 6379

maintenance_ip: "75.186.148.51"

static_url: /assets/
media_url: /uploads/
static_root: /var/www/{{ project_name }}/staticfiles
media_root: /var/www/{{ project_name }}/mediafiles

# vCPU budget knobs — adjust these to tune the gunicorn/celery split
system_reserved_vcpus: 2 # headroom for OS, Redis, Celery Beat
celery_vcpu_divisor: 4 # 1 Celery worker per N remaining vCPUs

# Kept in sync with CELERY_TASK_TIME_LIMIT in config/settings/base.py
celery_task_time_limit: 900

# Auto-derived from server vCPU count (ansible_processor_vcpus)
celery_workers: "{{ [((ansible_processor_vcpus - system_reserved_vcpus) // celery_vcpu_divisor) | int, 2] | max }}"
gunicorn_workers: "{{ [((ansible_processor_vcpus - system_reserved_vcpus - (celery_workers | int)) * 2 + 1) | int, 3] | max }}"
gunicorn_bind: "unix:/run/gunicorn/{{ project_name }}.sock"

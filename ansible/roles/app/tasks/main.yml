---
# tasks file for roles/app
- name: Install uv
  pip:
    name: uv
    executable: pip3
    extra_args: --break-system-packages

- name: Install Python {{ python_version }} via uv
  become_user: '{{ app_user }}'
  command: 'uv python install {{ python_version }}'

- name: Create app home directory
  file:
    path: '{{ app_home }}'
    state: directory
    owner: '{{ app_user }}'
    group: '{{ app_group }}'
    mode: '0755'

- name: Clone or update the app repo
  become_user: '{{ app_user }}'
  git:
    repo: '{{ app_repo }}'
    dest: '{{ app_src }}'
    version: '{{ app_branch }}'
    accept_hostkey: yes
  notify:
    - Restart gunicorn
    - Restart celery

- name: Create app subdirectories
  file:
    path: '{{ item }}'
    state: directory
    owner: '{{ app_user }}'
    group: '{{ app_group }}'
    mode: '0755'
  loop:
    - '{{ app_home }}/logs'
    - '{{ app_home }}/data'

- name: Install Python dependencies via uv
  become_user: '{{ app_user }}'
  command: uv sync --frozen
  args:
    chdir: '{{ app_src }}'

- name: Template environment file
  template:
    src: env.j2
    dest: '{{ app_env_file }}'
    owner: '{{ app_user }}'
    group: '{{ app_group }}'
    mode: '0600'
  notify:
    - Restart gunicorn
    - Restart celery

- name: Run Django migrations
  become_user: '{{ app_user }}'
  command: uv run python manage.py migrate --noinput
  args:
    chdir: '{{ app_src }}'

- name: Create static and media directories
  file:
    path: '{{ item }}'
    state: directory
    owner: '{{ app_user }}'
    group: www-data
    mode: '0755'
  loop:
    - '{{ static_root }}'
    - '{{ media_root }}'

- name: Collect static files
  become_user: '{{ app_user }}'
  command: uv run python manage.py collectstatic -i "*.sass" -i "*.scss" --noinput
  args:
    chdir: '{{ app_src }}'

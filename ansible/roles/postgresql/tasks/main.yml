---
# tasks file for roles/postgresql
- name: Add PGDG apt signing key
  apt_key:
    url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
    state: present

- name: Add PGDG apt repository
  apt_repository:
    repo: 'deb https://apt.postgresql.org/pub/repos/apt {{ ansible_distribution_release }}-pgdg main'
    state: present
    filename: pgdg

- name: Update apt cache after adding PGDG
  apt:
    update_cache: yes

- name: Install PostgreSQL
  apt:
    name:
      - 'postgresql-{{ postgres_version }}'
      - 'postgresql-contrib'
      - python3-psycopg2
    state: present

- name: Ensure PostgreSQL is started and enabled
  service:
    name: postgresql
    state: started
    enabled: yes

- name: Create app database
  become_user: postgres
  community.postgresql.postgresql_db:
    name: '{{ postgres_db }}'
    encoding: UTF-8
    lc_collate: en_US.UTF-8
    lc_ctype: en_US.UTF-8
    template: template0
    state: present

- name: Create app database user
  become_user: postgres
  community.postgresql.postgresql_user:
    name: '{{ postgres_user }}'
    password: '{{ postgres_password }}'
    state: present

- name: Grant privileges on database
  become_user: postgres
  community.postgresql.postgresql_privs:
    db: '{{ postgres_db }}'
    roles: '{{ postgres_user }}'
    type: database
    privs: ALL

- name: Grant privileges on public schema
  become_user: postgres
  community.postgresql.postgresql_privs:
    db: '{{ postgres_db }}'
    roles: '{{ postgres_user }}'
    type: schema
    objs: public
    privs: ALL

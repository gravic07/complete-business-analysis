---
# tasks file for roles/nginx
- name: Install NGINX and certbot
  apt:
    name:
      - nginx
      - certbot
      - python3-certbot-nginx
    state: present

- name: Deploy SSL params snippet
  template:
    src: ssl-params.conf.j2
    dest: /etc/nginx/snippets/ssl-params.conf
    mode: '0644'

- name: Remove default NGINX site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent

- name: Create maintenance page directory
  file:
    path: /var/www/maintenance
    state: directory
    owner: www-data
    group: www-data
    mode: '0755'

- name: Deploy maintenance page
  template:
    src: maintenance.html.j2
    dest: /var/www/maintenance/maintenance.html
    owner: www-data
    group: www-data
    mode: '0644'

- name: Check if Let's Encrypt cert exists
  stat:
    path: /etc/letsencrypt/live/{{ domain_name }}/fullchain.pem
  register: cert_stat

# certbot standalone opens its own port-80 listener — nginx must be stopped first.
# This block only runs on first provision; subsequent runs skip it (cert already exists).
- name: Stop nginx for certbot standalone challenge
  service:
    name: nginx
    state: stopped
  when: not cert_stat.stat.exists

- name: Obtain Let's Encrypt cert
  command: >
    certbot certonly --standalone --non-interactive --agree-tos
    --email {{ admin_email }}
    -d {{ domain_name }}
  args:
    creates: /etc/letsencrypt/live/{{ domain_name }}/fullchain.pem

# The cert uses the standalone authenticator, so renewals need port 80 free.
# certbot runs every script in these directories around each renewal attempt.
- name: Ensure certbot renewal hook directories exist
  file:
    path: /etc/letsencrypt/renewal-hooks/{{ item }}
    state: directory
    mode: '0755'
  loop: ['pre', 'post']

- name: Install certbot pre-hook to stop nginx
  copy:
    dest: /etc/letsencrypt/renewal-hooks/pre/stop-nginx.sh
    content: |
      #!/bin/sh
      systemctl stop nginx
    mode: '0755'

- name: Install certbot post-hook to start nginx
  copy:
    dest: /etc/letsencrypt/renewal-hooks/post/start-nginx.sh
    content: |
      #!/bin/sh
      systemctl start nginx
    mode: '0755'

- name: Ensure certbot renewal timer is enabled
  systemd:
    name: certbot.timer
    state: started
    enabled: yes

# No-op unless the cert is within 30 days of expiry (or already expired).
# Without a TTY certbot sleeps up to 8 minutes before renewing; skip that here.
- name: Renew Let's Encrypt cert if due
  command: certbot renew --non-interactive --no-random-sleep-on-renew
  register: certbot_renew
  changed_when: "'No renewals were attempted' not in (certbot_renew.stdout + certbot_renew.stderr)"

- name: Generate DH parameters for SSL
  command: openssl dhparam -out /etc/letsencrypt/ssl-dhparams.pem 2048
  args:
    creates: /etc/letsencrypt/ssl-dhparams.pem

- name: Template app NGINX config
  template:
    src: app.conf.j2
    dest: /etc/nginx/sites-available/{{ project_name }}.conf
  notify: Reload nginx

- name: Enable app site
  file:
    src: /etc/nginx/sites-available/{{ project_name }}.conf
    dest: /etc/nginx/sites-enabled/{{ project_name }}.conf
    state: link
  notify: Reload nginx

- name: Ensure NGINX running
  service:
    name: nginx
    state: started
    enabled: yes

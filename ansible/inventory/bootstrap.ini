# Used ONLY for the initial provision of a fresh DigitalOcean Droplet.
# DigitalOcean provides root credentials on port 22 at first boot.
# After site.yml completes: root login is disabled, port moves to 2207, admin user exists.
# Switch to production.ini for all subsequent runs.
[web]
cba-prod ansible_host=178.128.176.16 ansible_user=root ansible_port=22

[all:vars]
ansible_python_interpreter=/usr/bin/python3

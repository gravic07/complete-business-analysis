{% for category, bound_field in form.get_category_fields %}
  <div class="box mb-5">
    <h2 class="title is-5 has-text-primary">{{ category.name }}</h2>
    <hr />
    {% for error in bound_field.errors %}<p class="help is-danger">{{ error }}</p>{% endfor %}
    <div class="control">{{ bound_field }}</div>
  </div>
{% endfor %}

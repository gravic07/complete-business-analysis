{% extends 'snippets/input-base.html' %}

{% block control %}
  <div class="control{% if icon %} has-icons-left{% endif %}">
    <div class="select{% if fullwidth %} is-fullwidth{% endif %}">{{ field }}</div>
    {% if icon %}
      <span class="icon is-small is-left">
        <i class="fa-duotone fa-regular {{ icon }}"></i>
      </span>
    {% endif %}
  </div>
{% endblock control %}
